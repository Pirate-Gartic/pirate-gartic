<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cháchara - Dibujar</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body class="drawing-body">

<!-- Hidden native color picker for custom colors -->
<input type="color" id="native-color-input" value="#ff0000">

<div id="drawing-screen">

    <!-- ══════════ LEFT PANEL ══════════ -->
    <div id="left-panel">
        <canvas id="color-wheel-canvas" width="90" height="90"></canvas>
        <div id="current-color-ring"></div>
        <div class="swatches-grid" id="swatches-grid">
            <!-- Generated by JS -->
        </div>
    </div>

    <!-- ══════════ RIGHT AREA ══════════ -->
    <div id="right-area">

        <!-- Prompt -->
        <div id="prompt-box">
            <img src="assets/logos/logo.png" alt="Cháchara" class="logo-drawing">
            <div id="prompt-texts">
                <span id="prompt-label">Crea un...</span>
                <span id="prompt-text">🎨 Cargando prompt...</span>
            </div>
        </div>

        <!-- Canvas -->
        <div id="canvas-wrapper">
            <canvas id="drawing-canvas"></canvas>
            <div id="canvas-locked-overlay"></div>
        </div>

        <!-- Toolbar -->
        <div id="toolbar">

            <!-- Draw tools -->
            <button class="tool-btn active" id="tool-pencil" title="Lápiz">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M14 2.5l3.5 3.5-10 10L4 17l.5-3.5L14 2.5z" stroke="#333" stroke-width="2" stroke-linejoin="round" fill="none"/>
                    <path d="M12 4.5l3.5 3.5" stroke="#333" stroke-width="1.5"/>
                </svg>
            </button>
            <button class="tool-btn" id="tool-eraser" title="Borrador">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M3 16h14M12 4l4 4-7 8H5l-2-2 9-10z" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </button>

            <div class="tool-sep"></div>

            <!-- Shapes -->
            <button class="tool-btn" id="tool-rect" title="Rectángulo">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <rect x="2" y="5" width="16" height="10" stroke="#333" stroke-width="2.5" rx="1"/>
                </svg>
            </button>
            <button class="tool-btn" id="tool-triangle" title="Triángulo">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <polygon points="10,2 18,17 2,17" stroke="#333" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
                </svg>
            </button>
            <button class="tool-btn" id="tool-circle" title="Círculo / Elipse">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <ellipse cx="10" cy="10" rx="8" ry="8" stroke="#333" stroke-width="2.5"/>
                </svg>
            </button>
            <button class="tool-btn" id="tool-star" title="Estrella">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <polygon points="10,2 12.4,7.5 18.5,8 14,12 15.6,18 10,15 4.4,18 6,12 1.5,8 7.6,7.5" stroke="#333" stroke-width="2" stroke-linejoin="round" fill="none"/>
                </svg>
            </button>
            <button class="tool-btn" id="tool-line" title="Línea recta">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <line x1="3" y1="17" x2="17" y2="3" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </button>

            <div class="tool-sep"></div>

            <!-- Brush size -->
            <div id="size-group">
                <div id="size-preview">
                    <div id="size-dot" style="width:5px;height:5px;"></div>
                </div>
                <input type="range" id="brush-size-range" min="1" max="40" value="5">
            </div>

            <div class="tool-sep"></div>

            <!-- Undo & Clear -->
            <button class="tool-btn" id="btn-undo" title="Deshacer (Ctrl+Z)">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M4 8H13C15.8 8 18 10.2 18 13C18 15.8 15.8 18 13 18H7" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M7 4L3 8L7 12" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button class="tool-btn" id="btn-clear" title="Limpiar todo">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M5 5l10 10M15 5L5 15" stroke="#e53935" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </button>

            <div class="tool-sep"></div>

            <!-- Timer -->
            <div id="timer-btn">
                <span id="timer-text">1:30</span>
            </div>

            <!-- Listo -->
            <button id="btn-listo">✅ ¡Listo!</button>

        </div>
    </div>
</div>

<!-- Done overlay -->
<div id="done-overlay">
    <div id="done-card">
        <span class="done-icon" id="done-icon">🎉</span>
        <h2 id="done-title">¡Dibujito guardado!</h2>
        <p id="done-msg">Esperando a los demás jugadores<span class="dots"></span></p>
    </div>
</div>

<script src="scripts/draw.js"></script>
</body>
</html>
