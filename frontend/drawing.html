<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cháchara - Dibujar</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── Override body for full-screen drawing layout ── */
        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            padding: 0;
            margin: 0;
        }

        /* ══════════════════════════════════════════
           MAIN LAYOUT
        ══════════════════════════════════════════ */
        #drawing-screen {
            display: flex;
            flex-direction: row;
            width: 100vw;
            height: 100vh;
            padding: 14px;
            gap: 12px;
            box-sizing: border-box;
        }

        /* ══════════════════════════════════════════
           LEFT PANEL — Color Picker
        ══════════════════════════════════════════ */
        #left-panel {
            background: #fffef0;
            border: 4px solid #000;
            border-radius: 22px;
            padding: 14px 12px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            min-width: 116px;
            width: 116px;
            box-shadow: 0 6px 0 rgba(0,0,0,0.25);
            flex-shrink: 0;
            overflow-y: auto;
        }

        #color-wheel-canvas {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            cursor: crosshair;
            border: 3px solid #000;
            box-shadow: 0 3px 0 rgba(0,0,0,0.2);
            display: block;
            flex-shrink: 0;
        }

        #current-color-ring {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 4px solid #000;
            box-shadow: 0 3px 0 rgba(0,0,0,0.3);
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .swatches-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
            width: 100%;
        }

        .swatch {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 7px;
            border: 2.5px solid #000;
            cursor: pointer;
            transition: transform 0.12s, box-shadow 0.12s;
            box-shadow: 0 2px 0 rgba(0,0,0,0.25);
        }

        .swatch:hover { transform: scale(1.14); }

        .swatch.active {
            border-color: #fff;
            box-shadow: 0 0 0 2px #000, 0 0 0 4px #fff;
            transform: scale(1.14);
        }

        .swatch-custom {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 7px;
            border: 2.5px dashed #999;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            color: #888;
            transition: border-color 0.15s, color 0.15s;
            font-family: 'Fredoka', sans-serif;
            padding: 0;
            grid-column: span 2;
            height: 26px;
            aspect-ratio: unset;
        }
        .swatch-custom:hover { border-color: #444; color: #444; }

        /* Hidden native color input */
        #native-color-input { display: none; }

        /* ══════════════════════════════════════════
           RIGHT AREA
        ══════════════════════════════════════════ */
        #right-area {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 10px;
            min-width: 0;
        }

        /* ── Prompt box ── */
        #prompt-box {
            background: linear-gradient(160deg, #dbeafe 0%, #eff6ff 100%);
            border: 4px solid #000;
            border-radius: 16px;
            padding: 9px 20px;
            text-align: center;
            box-shadow: 0 5px 0 rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        #prompt-label {
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #1e3a8a;
            display: block;
            line-height: 1.2;
        }

        #prompt-text {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.25rem;
            font-style: italic;
            color: #1d4ed8;
            display: block;
            line-height: 1.3;
        }

        /* ── Canvas wrapper ── */
        #canvas-wrapper {
            flex: 1;
            background: #ffffff;
            border: 5px solid #000;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            min-height: 0;
        }

        #drawing-canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #canvas-locked-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.04);
            cursor: not-allowed;
            z-index: 5;
        }

        /* ── Toolbar ── */
        #toolbar {
            background: #fffef0;
            border: 4px solid #000;
            border-radius: 18px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 7px;
            box-shadow: 0 5px 0 rgba(0,0,0,0.2);
            flex-shrink: 0;
            flex-wrap: nowrap;
            overflow-x: auto;
        }

        .tool-btn {
            width: 38px;
            height: 38px;
            min-width: 38px;
            border-radius: 10px;
            border: 3px solid #000;
            background: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.1s, transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 3px 0 rgba(0,0,0,0.2);
            padding: 0;
            font-size: 1rem;
            font-family: 'Fredoka', sans-serif;
        }

        .tool-btn:hover:not(:disabled) {
            background: #f5f5f5;
            transform: translateY(-1px);
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .tool-btn.active {
            background: var(--btn-yellow);
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.2);
        }

        .tool-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .tool-sep {
            width: 2px;
            height: 28px;
            background: rgba(0,0,0,0.12);
            border-radius: 2px;
            flex-shrink: 0;
        }

        /* Brush size control */
        #size-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 80px;
            max-width: 160px;
        }

        #size-preview {
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        #size-dot {
            border-radius: 50%;
            background: #000;
            transition: width 0.1s, height 0.1s;
        }

        #brush-size-range {
            flex: 1;
            accent-color: #1e40af;
            cursor: pointer;
            height: 4px;
        }

        /* Timer */
        #timer-btn {
            width: 54px;
            height: 54px;
            min-width: 54px;
            border-radius: 50%;
            border: 4px solid #000;
            background: #bbf7d0;
            cursor: default;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 rgba(0,0,0,0.25);
            font-family: 'Fredoka', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: #14532d;
            user-select: none;
            transition: background 0.4s, color 0.4s;
            flex-shrink: 0;
        }

        #timer-btn.warn {
            background: #fef08a;
            color: #713f12;
        }

        #timer-btn.danger {
            background: #fecaca;
            color: #7f1d1d;
            animation: timer-pulse 0.6s ease-in-out infinite alternate;
        }

        @keyframes timer-pulse {
            from { transform: scale(1); }
            to   { transform: scale(1.08); }
        }

        /* Listo button */
        #btn-listo {
            padding: 9px 18px;
            width: auto;
            min-width: 90px;
            font-size: 1.25rem;
            background: #16a34a;
            color: #fff;
            border: 4px solid #000;
            border-radius: 14px;
            box-shadow: 0 5px 0 #14532d, 0 5px 0 3px #000;
            transition: transform 0.1s, box-shadow 0.1s;
            white-space: nowrap;
            margin-bottom: 0;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
            flex-shrink: 0;
        }

        #btn-listo:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #14532d, 0 1px 0 3px #000;
        }

        #btn-listo:disabled {
            background: #9ca3af;
            box-shadow: 0 3px 0 #6b7280, 0 3px 0 3px #000;
            cursor: not-allowed;
            transform: none;
        }

        /* ══════════════════════════════════════════
           DONE OVERLAY
        ══════════════════════════════════════════ */
        #done-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 200;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        #done-overlay.show { display: flex; }

        #done-card {
            background: var(--card-blue);
            border: 6px solid #000;
            border-radius: 26px;
            padding: 38px 52px;
            text-align: center;
            box-shadow: 0 12px 0 var(--card-border), 0 12px 0 6px #000;
            animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        #done-card .done-icon { font-size: 3.5rem; display: block; margin-bottom: 8px; }
        #done-card h2 {
            color: var(--btn-yellow);
            font-size: 2.2rem;
            text-shadow: 3px 3px 0 #000;
            margin: 0 0 10px;
        }
        #done-card p {
            color: rgba(255,255,255,0.9);
            font-size: 1.1rem;
            text-shadow: 1px 1px 0 #000;
            margin: 0;
        }

        /* Spinner dot animation */
        .dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }
    </style>
</head>
<body>

<!-- Hidden native color picker for custom colors -->
<input type="color" id="native-color-input" value="#ff0000">

<div id="drawing-screen">

    <!-- ══════════ LEFT PANEL ══════════ -->
    <div id="left-panel">
        <canvas id="color-wheel-canvas" width="90" height="90"></canvas>
        <div id="current-color-ring"></div>
        <div class="swatches-grid" id="swatches-grid">
            <!-- Generated by JS -->
        </div>
    </div>

    <!-- ══════════ RIGHT AREA ══════════ -->
    <div id="right-area">

        <!-- Prompt -->
        <div id="prompt-box">
            <span id="prompt-label">Crea un...</span>
            <span id="prompt-text">🎨 Cargando prompt...</span>
        </div>

        <!-- Canvas -->
        <div id="canvas-wrapper">
            <canvas id="drawing-canvas"></canvas>
            <div id="canvas-locked-overlay"></div>
        </div>

        <!-- Toolbar -->
        <div id="toolbar">
            <!-- Draw tools -->
            <button class="tool-btn active" id="tool-pencil" title="Lápiz">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M14 2.5l3.5 3.5-10 10L4 17l.5-3.5L14 2.5z" stroke="#333" stroke-width="2" stroke-linejoin="round" fill="none"/>
                    <path d="M12 4.5l3.5 3.5" stroke="#333" stroke-width="1.5"/>
                </svg>
            </button>
            <button class="tool-btn" id="tool-eraser" title="Borrador">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M3 16h14M12 4l4 4-7 8H5l-2-2 9-10z" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </button>

            <div class="tool-sep"></div>

            <!-- Shapes -->
            <button class="tool-btn" id="tool-rect" title="Rectángulo">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <rect x="2" y="5" width="16" height="10" stroke="#333" stroke-width="2.5" rx="1"/>
                </svg>
            </button>
            <button class="tool-btn" id="tool-triangle" title="Triángulo">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <polygon points="10,2 18,17 2,17" stroke="#333" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
                </svg>
            </button>
            <button class="tool-btn" id="tool-circle" title="Círculo / Elipse">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <ellipse cx="10" cy="10" rx="8" ry="8" stroke="#333" stroke-width="2.5"/>
                </svg>
            </button>
            <button class="tool-btn" id="tool-star" title="Estrella">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <polygon points="10,2 12.4,7.5 18.5,8 14,12 15.6,18 10,15 4.4,18 6,12 1.5,8 7.6,7.5" stroke="#333" stroke-width="2" stroke-linejoin="round" fill="none"/>
                </svg>
            </button>
            <button class="tool-btn" id="tool-line" title="Línea recta">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <line x1="3" y1="17" x2="17" y2="3" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </button>

            <div class="tool-sep"></div>

            <!-- Brush size -->
            <div id="size-group">
                <div id="size-preview">
                    <div id="size-dot" style="width:5px;height:5px;"></div>
                </div>
                <input type="range" id="brush-size-range" min="1" max="40" value="5">
            </div>

            <div class="tool-sep"></div>

            <!-- Undo & Clear -->
            <button class="tool-btn" id="btn-undo" title="Deshacer (Ctrl+Z)">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M4 8H13C15.8 8 18 10.2 18 13C18 15.8 15.8 18 13 18H7" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M7 4L3 8L7 12" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button class="tool-btn" id="btn-clear" title="Limpiar todo">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M5 5l10 10M15 5L5 15" stroke="#e53935" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </button>

            <div class="tool-sep"></div>

            <!-- Timer -->
            <div id="timer-btn">
                <span id="timer-text">1:30</span>
            </div>

            <!-- Listo -->
            <button id="btn-listo">✅ ¡Listo!</button>
        </div>
    </div>
</div>

<!-- Done overlay -->
<div id="done-overlay">
    <div id="done-card">
        <span class="done-icon" id="done-icon">🎉</span>
        <h2 id="done-title">¡Dibujito guardado!</h2>
        <p id="done-msg">Esperando a los demás jugadores<span class="dots"></span></p>
    </div>
</div>
<script src="draw.js"></script>
</body>
</html>
