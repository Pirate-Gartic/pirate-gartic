<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cháchara - Resultados</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { overflow-y: auto; align-items: flex-start; padding: 40px 20px; }
        .results-container { width: 100%; max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
        h1 { color: var(--btn-yellow); font-size: 3rem; text-shadow: 4px 4px 0 #000; text-align: center; margin-bottom: 10px; }
        
        .cadena-card {
            background: var(--card-blue); border: 6px solid #000; border-radius: 25px;
            padding: 30px; box-shadow: 0 10px 0 var(--card-border), 0 10px 0 6px #000;
        }
        .cadena-title {
            color: #fff; font-size: 1.5rem; text-align: center; text-shadow: 2px 2px 0 #000;
            margin-top: 0; margin-bottom: 25px; border-bottom: 3px dashed rgba(0,0,0,0.3); padding-bottom: 15px;
        }
        
        .paso {
            background: #fffef0; border: 4px solid #000; border-radius: 18px; padding: 20px;
            margin-bottom: 20px; text-align: center; position: relative; box-shadow: 0 5px 0 rgba(0,0,0,0.2);
        }
        .paso-autor {
            position: absolute; top: -15px; left: 20px; background: var(--btn-yellow);
            color: #000; padding: 4px 15px; border: 3px solid #000; border-radius: 12px;
            font-weight: bold; font-size: 1.1rem; box-shadow: 2px 2px 0 #000;
        }
        .paso-texto { font-size: 1.6rem; color: #1e3a8a; font-weight: bold; margin: 20px 0 0 0; }
        .paso-dibujo { width: 100%; max-width: 400px; border: 3px solid #000; border-radius: 10px; margin-top: 15px; background: #fff;}
        
        .btn-volver {
            width: 100%; max-width: 300px; margin: 0 auto; display: block; font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="results-container">
        <h1>¡RESULTADOS!</h1>
        <div id="cadenas-wrapper">
            <h2 style="color: white; text-align:center;">Cargando los chismes...</h2>
        </div>
        <button id="btn-volver" class="btn-volver">VOLVER AL INICIO</button>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api';
        const idSala = localStorage.getItem('idSala');
        
        if(!idSala) window.location.href = 'index.html';

        document.getElementById('btn-volver').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = 'index.html';
        });

        async function cargarResultados() {
            try {
                const resp = await fetch(`${API_URL}/juego/${idSala}/resultados`);
                if (!resp.ok) throw new Error("Error al cargar");
                
                const cadenas = await resp.json();
                const wrapper = document.getElementById('cadenas-wrapper');
                wrapper.innerHTML = '';

                cadenas.forEach(cadena => {
                    const card = document.createElement('div');
                    card.className = 'cadena-card';
                    
                    const title = document.createElement('h2');
                    title.className = 'cadena-title';
                    title.textContent = `📓 El cuaderno de ${cadena.creador}`;
                    card.appendChild(title);

                    cadena.pasos.forEach(paso => {
                        const divPaso = document.createElement('div');
                        divPaso.className = 'paso';

                        const autor = document.createElement('div');
                        autor.className = 'paso-autor';
                        autor.textContent = paso.autor;
                        divPaso.appendChild(autor);

                        if (paso.tipo === 'TEXTO') {
                            const txt = document.createElement('p');
                            txt.className = 'paso-texto';
                            txt.textContent = `"${paso.contenido}"`;
                            divPaso.appendChild(txt);
                        } else if (paso.tipo === 'DIBUJO') {
                            const img = document.createElement('img');
                            img.className = 'paso-dibujo';
                            img.src = paso.contenido; // Ya viene armado desde el backend con base64 y DynamoDB
                            divPaso.appendChild(img);
                        }
                        card.appendChild(divPaso);
                    });

                    wrapper.appendChild(card);
                });

            } catch (error) {
                document.getElementById('cadenas-wrapper').innerHTML = '<h2 style="color:white; text-align:center;">Hubo un problema recuperando las imágenes de DynamoDB.</h2>';
            }
        }

        cargarResultados();
    </script>
</body>
</html>
