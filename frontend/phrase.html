<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cháchara - Escribe</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .game-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; text-align: center;}
        h1 { color: var(--btn-yellow); font-size: 2.5rem; text-shadow: 3px 3px 0 #000; }
        .input-card { background: #fffef0; border: 5px solid #000; border-radius: 20px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 8px 0 rgba(0,0,0,0.25); }
        .phrase-input { width: 100%; padding: 15px; font-size: 1.5rem; border: 3px solid #000; border-radius: 12px; box-sizing: border-box; font-family: 'Fredoka', sans-serif; text-align: center; margin-bottom: 20px; }
        #timer-circle { width: 80px; height: 80px; border-radius: 50%; border: 5px solid #000; background: #bbf7d0; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; margin: 0 auto 20px; }
        #waiting-msg { display: none; font-size: 1.5rem; color: #1e3a8a; font-weight: bold;}
    </style>
</head>
<body>
    <div class="game-wrapper">
        <h1 id="titulo">¡Describe la situación!</h1>
        <div id="imagen-previa" style="display:none; margin-bottom:15px;">
            <img id="img-a-describir" src="" style="max-width:300px; border:4px solid #000; border-radius:15px;">
        </div>
        
        <div class="input-card">
            <div id="timer-circle">40</div>
            <input type="text" id="phrase-input" class="phrase-input" placeholder="Ej: Un perro alienígena...">
            <button id="btn-enviar">¡LISTO!</button>
            <p id="waiting-msg">Esperando a los demás jugadores...</p>
        </div>
    </div>

    <script src="phrase.js"></script>
</body>
</html>
