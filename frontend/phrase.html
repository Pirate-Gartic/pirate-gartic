<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/icons/icon.ico">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <title>Cháchara - Escribe</title>
    <link rel="stylesheet" href="styles/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body class="phrase-body">
    <img src="assets/logos/logo.png" alt="Cháchara" class="logo-corner">

    <div class="game-wrapper">
        <h1 id="titulo">¡Describe la situación!</h1>

        <div id="imagen-previa" style="display:none;">
            <img id="img-a-describir" src="" alt="Dibujo a describir">
        </div>

        <div class="input-card">
            <div id="timer-circle">40</div>
            <input type="text" id="phrase-input" class="phrase-input"
                   placeholder="Ej: Un perro alienígena..."
                   autocomplete="off" autocorrect="off" spellcheck="false">
            <button id="btn-enviar">¡LISTO!</button>
            <p id="waiting-msg">Esperando a los demás jugadores...</p>
        </div>
    </div>

    <script src="scripts/heartbeat.js"></script>
    <script src="scripts/phrase.js"></script>
</body>
</html>
