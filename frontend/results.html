<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cháchara - Resultados</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body class="results-body">

    <div class="results-container">
        <img src="assets/logos/logo.png" alt="Cháchara" class="logo-results">
        <h1>¡RESULTADOS!</h1>

        <div id="cadenas-wrapper">
            <h2 style="color: white; text-align:center;">Cargando los chismes...</h2>
        </div>

        <div class="botones-container">
            <button id="btn-jugar-nuevo" class="btn-volver" style="display: none;">JUGAR DE NUEVO</button>
            <button id="btn-volver" class="btn-volver">SALIR AL INICIO</button>
        </div>

        <h3 id="msg-esperando" style="color: white; text-align: center; display: none; margin-top: 10px;">
            ⏳ Esperando a que el Host inicie otra ronda...
        </h3>
    </div>

    <script src="scripts/results.js"></script>
</body>
</html>
