<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cháchara - Resultados</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { overflow-y: auto; align-items: flex-start; padding: 40px 20px; }
        .results-container { 
            width: 100%; max-width: 700px; margin: 0 auto; 
            display: flex; flex-direction: column; gap: 40px; 
            align-items: center; /* Asegura que todo el contenido esté centrado */
        }
        h1 { color: var(--btn-yellow); font-size: 3rem; text-shadow: 4px 4px 0 #000; text-align: center; margin-bottom: 10px; }
        
        #cadenas-wrapper { width: 100%; }

        .cadena-card {
            background: var(--card-blue); border: 6px solid #000; border-radius: 25px;
            padding: 30px; box-shadow: 0 10px 0 var(--card-border), 0 10px 0 6px #000;
            width: 100%; box-sizing: border-box;
        }
        .cadena-title {
            color: #fff; font-size: 1.5rem; text-align: center; text-shadow: 2px 2px 0 #000;
            margin-top: 0; margin-bottom: 25px; border-bottom: 3px dashed rgba(0,0,0,0.3); padding-bottom: 15px;
        }
        
        .paso {
            background: #fffef0; border: 4px solid #000; border-radius: 18px; padding: 20px;
            margin-bottom: 20px; text-align: center; position: relative; box-shadow: 0 5px 0 rgba(0,0,0,0.2);
        }
        .paso-autor {
            position: absolute; top: -15px; left: 20px; background: var(--btn-yellow);
            color: #000; padding: 4px 15px; border: 3px solid #000; border-radius: 12px;
            font-weight: bold; font-size: 1.1rem; box-shadow: 2px 2px 0 #000;
        }
        .paso-texto { font-size: 1.6rem; color: #1e3a8a; font-weight: bold; margin: 20px 0 0 0; }
        .paso-dibujo { width: 100%; max-width: 400px; border: 3px solid #000; border-radius: 10px; margin-top: 15px; background: #fff;}
        
        .botones-container { 
            display: flex; flex-direction: column; gap: 15px; 
            width: 100%; max-width: 300px; margin: 0 auto; 
            align-items: center; /* Centra los botones en sí mismos */
        }
        .btn-volver { font-size: 1.5rem; width: 100%; }
        /* Color especial para que destaque el de jugar de nuevo */
        #btn-jugar-nuevo { background-color: #4ade80; } 
    </style>
</head>
<body>

    <div class="results-container">
        <h1>¡RESULTADOS!</h1>
        <div id="cadenas-wrapper">
            <h2 style="color: white; text-align:center;">Cargando los chismes...</h2>
        </div>
        
        <div class="botones-container">
            <button id="btn-jugar-nuevo" class="btn-volver" style="display: none;">JUGAR DE NUEVO</button>
            <button id="btn-volver" class="btn-volver">SALIR AL INICIO</button>
        </div>
        
        <h3 id="msg-esperando" style="color: white; text-align: center; display: none; margin-top: 10px;">
            ⏳ Esperando a que el Host inicie otra ronda...
        </h3>
    </div>

    <script src="results.js"></script>
</body>
</html>
