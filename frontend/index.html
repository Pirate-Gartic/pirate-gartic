<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/icons/icon.ico">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <title>Cháchara - Inicio</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="doodle d1">✏️</div>
    <div class="doodle d2">💬</div>
    <div class="doodle d3">🎨</div>
    <div class="doodle d4">💡</div>
    <div class="doodle d5">😂</div>
    <div class="doodle d6">🎲</div>

    <div class="login-container">
        <header class="logo">
            <img src="assets/logos/logo.png" alt="Cháchara" class="logo-img">
        </header>

        <div class="card">

            <div class="tabs">
                <button class="tab active" onclick="switchTab('tab-crear')">CREAR SALA</button>
                <button class="tab" onclick="switchTab('tab-unirse')">UNIRSE</button>
            </div>

            <!-- ── TAB: CREAR ── -->
            <div id="tab-crear" class="tab-content active">

                <div id="crear-guest" class="view-section">
                    <div class="avatar-selection">
                        <div id="crear-avatar-display" class="avatar-display-box"></div>
                        <p>Elige tu avatar</p>
                    </div>
                    <div class="avatar-picker" id="crear-avatar-picker"></div>
                    <input type="text" id="crear-username" placeholder="Tu apodo (Invitado)" maxlength="15" autocomplete="off">
                    <button id="btn-crear-sala">CREAR SALA</button>
                    <div class="toggle-links">
                        <p onclick="switchSubView('crear-guest', 'crear-login')">¿Tienes cuenta? Inicia sesión para crear</p>
                    </div>
                </div>

                <div id="crear-login" class="view-section hidden">
                    <div class="avatar-selection">
                        <div class="avatar-static">👋</div>
                        <p>Inicia sesión para crear</p>
                    </div>
                    <input type="email" id="crear-login-email" placeholder="Correo electrónico" autocomplete="off">
                    <input type="password" id="crear-login-pass" placeholder="Contraseña">
                    <button id="btn-crear-login">ENTRAR Y CREAR</button>
                    <div class="toggle-links">
                        <p onclick="switchSubView('crear-login', 'crear-register')">¿No tienes cuenta? Regístrate</p>
                        <p onclick="switchSubView('crear-login', 'crear-guest')">Mejor como invitado</p>
                    </div>
                </div>

                <div id="crear-register" class="view-section hidden">
                    <div class="avatar-selection">
                        <div id="reg-avatar-display" class="avatar-display-box"></div>
                        <p>Elige tu avatar</p>
                    </div>
                    <div class="avatar-picker" id="reg-avatar-picker"></div>
                    <input type="text" id="reg-username" placeholder="Nombre de usuario" maxlength="15" autocomplete="off">
                    <input type="email" id="reg-email" placeholder="Correo electrónico" autocomplete="off">
                    <input type="password" id="reg-pass" placeholder="Contraseña">
                    <button id="btn-register">REGISTRARSE</button>
                    <div class="toggle-links">
                        <p onclick="switchSubView('crear-register', 'crear-login')">Volver al login</p>
                    </div>
                </div>

            </div>

            <!-- ── TAB: UNIRSE ── -->
            <div id="tab-unirse" class="tab-content">

                <input type="text" id="unirse-codigo" placeholder="CÓDIGO DE SALA" maxlength="6"
                    style="text-transform: uppercase; font-weight: bold; font-size: 1.5rem; letter-spacing: 5px;">

                <div id="unirse-guest" class="view-section">
                    <div class="avatar-selection">
                        <div id="unirse-avatar-display" class="avatar-display-box"></div>
                    </div>
                    <div class="avatar-picker" id="unirse-avatar-picker"></div>
                    <input type="text" id="unirse-username" placeholder="Tu apodo (Invitado)" maxlength="15" autocomplete="off">
                    <button id="btn-unirse-sala">UNIRSE A LA SALA</button>
                    <div class="toggle-links">
                        <p onclick="switchSubView('unirse-guest', 'unirse-login')">¿Tienes cuenta? Inicia sesión para unirte</p>
                    </div>
                </div>

                <div id="unirse-login" class="view-section hidden">
                    <div class="avatar-selection">
                        <div class="avatar-static">🔑</div>
                        <p>Usa tu cuenta para unirte</p>
                    </div>
                    <input type="email" id="unirse-login-email" placeholder="Correo electrónico" autocomplete="off">
                    <input type="password" id="unirse-login-pass" placeholder="Contraseña">
                    <button id="btn-unirse-login">ENTRAR Y UNIRSE</button>
                    <div class="toggle-links">
                        <p onclick="switchSubView('unirse-login', 'unirse-guest')">Unirse como invitado en su lugar</p>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <script src="scripts/script.js"></script>
</body>
</html>
