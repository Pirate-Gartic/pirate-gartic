name: Deploy Chachara to K3s

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 1. Preparar Java y Compilar el Backend
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Build Backend with Gradle
        working-directory: ./backend
        run: chmod +x gradlew && ./gradlew build

      # 2. Login explícito en docker.io usando tus secretos de GitHub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }} # Aquí pondrás tellojorge2005
          password: ${{ secrets.DOCKER_PASSWORD }} # Tu token de acceso

      # 3. Construir y Subir Backend
      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: docker.io/tellojorge2005/chachara-backend:latest

      # 4. Construir y Subir Frontend
      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: docker.io/tellojorge2005/chachara-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 5. Copiar la carpeta de Helm (charts/chachara) al servidor RHEL
      - name: Copy Helm charts via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST_RHEL }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "charts/chachara"
          target: "~/deploy/"

# 6. Ejecutar el despliegue en K3s e Instalar Cockpit
      - name: Execute Helm Upgrade and Setup Cockpit via SSH
        uses: appleboy/ssh-action@master  # <--- ¡Aquí está el appleboy!
        with:
          host: ${{ secrets.SERVER_HOST_RHEL }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Tu código original:
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            helm upgrade --install chachara-prod ~/deploy/charts/chachara
            
            # 2. LO NUEVO: Instalar Cockpit:
            sudo dnf install cockpit -y
            sudo systemctl enable --now cockpit.socket
            
            # 3. Abrir el firewall interno
            sudo firewall-cmd --add-port=9090/tcp --permanent
            sudo firewall-cmd --reload